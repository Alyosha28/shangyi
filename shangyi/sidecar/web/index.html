<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><title>商奕 · 经营咨询</title>
<link rel="stylesheet" href="/vendor/tabler.min.css"><link rel="stylesheet" href="/domain.css"><link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23232325'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h16M12 6v20M20 6v20' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
</head>
<body>
<a href="#view" class="skip-link">跳到正文</a>
<div class="app-shell">
<aside class="app-sidebar" id="sidebar" aria-label="咨询导航">
  <div class="sidebar-head"><a href="#/run" class="brand"><span class="brand-mark" aria-hidden="true">弈</span><span>商奕</span></a><button class="icon-button" id="sidebar-close" aria-label="收起导航" title="收起导航"></button></div>
  <nav id="nav">
    <a class="nav-item" href="#/run" data-nav="run" data-icon="plus">新咨询</a>
    <a class="nav-item" href="#/guide" data-nav="guide" data-icon="chat">使用引导</a>
    <a class="nav-item" href="#/cases" data-nav="cases" data-icon="search">查找咨询</a>
    <a class="nav-item" href="#/playground" data-nav="playground" data-icon="grid">比比看</a>
    <div class="sidebar-label recent-label">最近咨询 <button class="icon-button" id="refresh-history" aria-label="刷新列表" title="刷新列表"></button></div>
    <div id="recent-cases" class="recent-cases"><p class="sidebar-note">正在读取咨询…</p></div>
  </nav>
  <div class="sidebar-foot"><span class="avatar">我</span><div><strong>我的工作区</strong><span id="engine-status">正在连接…</span></div><a href="#/activity" class="icon-button" id="activity-link" aria-label="查看进度" title="进度"></a></div>
</aside>
<button class="sidebar-scrim" id="sidebar-scrim" aria-label="关闭导航" hidden></button>
<main class="workspace">
  <header class="workspace-header"><button class="icon-button" id="sidebar-open" aria-label="展开导航" title="展开导航"></button><span id="header-icon" aria-hidden="true"></span><span id="crumb">新咨询</span><div class="header-actions"><span id="page-status"></span><button class="quiet-button" id="evidence-toggle" aria-expanded="true" aria-controls="evidence-panel">看依据</button></div></header>
  <div class="workspace-body"><div class="center-pane"><div id="view" tabindex="-1"></div><div id="composer-host"></div></div>
    <aside class="evidence-panel" id="evidence-panel" aria-label="看依据"><div class="evidence-header"><span id="evidence-title">看依据</span><button class="icon-button" id="evidence-close" aria-label="收起依据" title="收起依据"></button></div><div id="evidence-content"></div></aside>
  </div>
</main>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<!-- 动效引擎：UMD bundle，挂出全局 Motion。必须先于 module 脚本执行且不加
     type=module，否则全局挂不上。缺失时 js/motion.js 会静默降级，页面照常可用。 -->
<script src="/vendor/motion.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body></html>
