# 商奕 L3 交付层：MCP（Model Context Protocol）stdio 服务端。
#
# 职责单一：把 `shangyi-tools` 注册表里的领域工具，按 MCP 的 JSON-RPC 2.0 线格式
# 暴露给 agent 运行时段（DeepSeek Harness）。**本 crate 不含任何领域逻辑**：
#   - 工具清单 ← `ToolRegistry::standard()`（唯一真相源）
#   - 参数 schema ← `shangyi_tools::schema::tool_schema()`（有就给真 schema）
#   - 执行 ← `shangyi_core::DomainExecutor`（唯一执行 seam）
#   - 阶段闸门 ← `ToolRegistry::check_call()` + `PhaseMachine`（不在这里重写判断）
#
# 这样划界的理由：协议层若复制一份领域规则，两份规则必然漂移，而漂移只会在
# 真实会话里暴露（"为什么这个工具在 CLI 能用、在 dsh 里被拒"）。
#
# 依赖方向：本 crate 在 L3 交付层，与 `shangyi-cli` 同级；它不反向依赖 cli。
[package]
name = "shangyi-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
shangyi-core = { path = "../shangyi-core" }
shangyi-tools = { path = "../shangyi-tools" }
shangyi-playbooks = { path = "../shangyi-playbooks" }
shangyi-kb = { path = "../shangyi-kb" }
# `web_fetch` 的真实抓取后端：与 CLI 用的是同一个 `HttpFetcher`
# （robots.txt + 限速 + 正文抽取都在那一处实现，不在这里复制）。
shangyi-intel = { path = "../shangyi-intel" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# 集成测试用同一个 serde_json；不引入额外 crate（临时目录自己造，见 tests/）。
serde_json = "1"
