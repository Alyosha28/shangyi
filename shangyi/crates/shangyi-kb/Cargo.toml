# 商奕 L1 领域基座：理论库与案例库（设计文档 §7）。
#
# 理论库（§7.1）：策展 markdown + RAG；条目 schema 四要素
#   （适用条件 / 失效条件 / 数据需求 / 输出物）。
# 案例库（§7.2）：回测闭环的核心资产——每次咨询预测留档，日后回填结果以校准选择权重。
#
# 【唯一真相源原则】（Harness §13.8）
# markdown 文件（含 frontmatter）是**唯一真相源**；矢量索引是**派生投影**（可重建、可丢弃）。
# 理由：索引会因 embedding 模型换代而重建，不能承载真相。
# 故本 crate 只处理 markdown 与其 frontmatter，**不**依赖任何向量库。
[package]
name = "shangyi-kb"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
shangyi-gamespec = { path = "../shangyi-gamespec" }
# 校准闭环的数据供给：案例库 → `BacktestRecord`（见 `CaseLibrary::backtest_records`）。
# 方向是 kb → selection，不成环（selection 不依赖 kb）。
shangyi-selection = { path = "../shangyi-selection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
