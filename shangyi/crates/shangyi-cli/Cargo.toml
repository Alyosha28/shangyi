# 商奕 L3 交付层：命令行入口（设计文档 §10 与 Harness §13.6）。
#
# 本 crate 不依赖第三方 CLI 框架（clap 等）：商奕的 CLI 参数面很小
# （new/resume/report/backtest/kb 五个子命令），自解析可避免为一层薄封装
# 引入依赖树。**注意**：这样做的代价是失去自动生成的 help 与补全——
# 若参数面增长，应改用 clap。
#
# 关键职责：把命令解析为**类型化的命令枚举**，使"未知命令/缺参数/非法组合"
# 在进入业务逻辑前即被拒绝（而非在各子命令里各写一遍校验）。
[package]
name = "shangyi-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "shangyi"
path = "src/main.rs"

[dependencies]
shangyi-core = { path = "../shangyi-core" }
shangyi-report = { path = "../shangyi-report" }
# `solve` 子命令：离线读入 GameSpec JSON 文件（解析与校验）
shangyi-gamespec = { path = "../shangyi-gamespec" }
# persona 群仿真：CLI 组装层构造 `LlmPersonaActor` 并注入执行器
# （组装细节——模型名、温度、客户端借用——留在这一层，不下沉到 core）
shangyi-swarm = { path = "../shangyi-swarm" }
# `backtest` 命令：校准判据权重（回测闭环的最后一环）
shangyi-selection = { path = "../shangyi-selection" }
shangyi-playbooks = { path = "../shangyi-playbooks" }
shangyi-tools = { path = "../shangyi-tools" }
# LLM 客户端与检索后端：CLI 是唯一把真实传输接进 agent 循环的地方
shangyi-llm = { path = "../shangyi-llm" }
# 理论库（kb_retrieve 的后端）
shangyi-kb = { path = "../shangyi-kb" }
# `mcp-serve` 子命令：把 38 个领域工具以 MCP stdio 服务暴露给 agent 运行时段
# （DeepSeek Harness）。协议与宿主都在那个 crate 里，本层只做参数解析与进程入口。
shangyi-mcp = { path = "../shangyi-mcp" }
# 公开网页抓取与检索后端（web_fetch / web_search 的落点）
shangyi-intel = { path = "../shangyi-intel" }
ureq = { version = "3", features = ["json"] }
serde_json = "1"
thiserror = "2"
