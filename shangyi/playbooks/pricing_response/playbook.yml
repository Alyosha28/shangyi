# 调价/促销响应剧本（设计文档 §13.3 的落地版）
#
# ⚠️ 与 §13.3 的示例相比，本文件**只包含当前 `Playbook` 结构体支持的字段**。
# §13.3 里的 intel_requirements / model_recommendation / solver / personas /
# novel_moves / consequence / discover / report 等段尚未建模，故不在此出现——
# 写进来而不被解析，会让读者以为它们生效了（那是比缺失更坏的失效）。
meta:
  id: pricing_response
  name: 调价/促销响应
  description: 差异化 Bertrand + 重复博弈；回答「我调价后对手怎么反应、各方结果如何」
  order: 10
  version: 1

# ── 适用条件（声明项 1）─────────────────────────────────────────
applicable_when:
  - 决策涉及本企业对最终顾客的价格或促销力度
  - 相同或邻近商圈存在 1–3 个可观察价格的直接竞对
  - 产品有可辨识的差异化（非同质大宗品）
# 失效条件与适用条件同等重要：说清「何时不该用」
fails_when:
  - 强容量约束（此时 Bertrand 结论失真，转 Cournot 数值路径）
  - 招投标/拍卖式定价（转 negotiation 或专用机制设计路径）
  - 对手价格不可观察（信息结构不满足）
required_inputs:
  - 本企业当前价格带
  - 主要竞对名单
  - 近 6 个月调价/促销事件
  - 粗略毛利率

value_net:
  priority: [substitutor, customer, supplier]
  scan_depth:
    substitutor: deep
    customer: medium
    supplier: shallow
    complementor: skip
    external: shallow

# ── intake 问题清单（声明项 3）─────────────────────────────────
intake:
  - id: q1
    text: "如果对手下个月在你同商圈降价 15%，你会怎么做？"
    kind: choice
    options: ["跟着降", "加大促销", "提升服务差异化", "按兵不动"]
  - id: q2
    text: "去年对手做过大促，当时你跟进了吗？效果如何？"
    kind: text
  - id: q3
    text: "你的毛利率大致在什么区间？（用于收益核算，不需要精确）"
    kind: text
  - id: q4
    text: "你能接受的最差结果是什么？"
    kind: text
  - id: q5
    text: "这次决策主要针对哪个竞对？"
    kind: text

# ── 推荐博弈模型（声明项 4）───────────────────────────────────
models:
  - differentiated_bertrand
  - repeated_game
  - cournot_numeric   # 容量约束强时的替代路径

# ── 选择器权重（声明项 5）──────────────────────────────────────
# learning 权重为 0：MVP 不实现该判据（差异登记 R17 记为 v0.2）。
# 显式写 0 而不是省略——省略会让"忘了配"与"有意关闭"无法区分。
selectors:
  risk_dom: 0.15
  stochastic: 0.25
  behavioral: 0.20
  focal_llm: 0.15
  persona_sim: 0.25
  learning: 0.0

# ── 工具白名单（声明项 6）──────────────────────────────────────
# 三种模式的主工具都在内：定价决策的 scenario / whatif / discover 三种问法
# 都成立。白名单是**上限**，阶段白名单会再收一层（§7.3 的两层过滤）。
tool_allowlist:
  - vn_map
  - pars_check
  - ask_user
  - poi_survey
  - web_search
  - research_record
  - business_cost
  - web_fetch
  - data_ingest
  - participant_profile_update
  - gamespec_build
  - gamespec_validate
  - solve_equilibria
  - select_equilibria
  - select_fuse
  - swarm_run
  - novel_move_filter
  - consequence_predict
  - monte_carlo
  - sensitivity_scan
  - discover_satisfice
  - preference_inject
  - report_render
  # R23/R24 新增：模型提议回退（用户裁决）+ recommend 阶段的产物工具。
  # **曾经漏加**：注册表与阶段白名单都加了，唯独剧本白名单没加——
  # 而它是第二层过滤，于是这两类工具在真实运行中**永远调不动**。
  - recommend_build
  - request_rewind
  - case_store_read
  - case_store_write
  - kb_retrieve
  - checkpoint
  # 探索性数值沙箱（设计文档 §5.3）。
  #
  # **为什么本剧本需要它**：本剧本声明了 `cournot_numeric` 作为
  # "容量约束强时的替代路径"，而连续策略（Cournot 的产量是连续量）
  # 不在离散求解器的能力范围内——设计文档明确规定这条路径走 `sandbox_exec`
  # 的临时数值求解。
  #
  # ⚠️ 它的产出是 `TrustLevel::Exploratory`——**不得进报告**（报告生成器拒绝
  # 读取该级别）。故它只能用于"探索"，而任何要进报告的结论必须由 Rust 侧
  # 重写。这条限制在 `shangyi-core::sandbox` 的模块文档里也写明了。
  - sandbox_exec

report_vars:
  equilibrium_distribution: "equilibrium_select.distribution"
  price_war_sustainability: "solver.dynamics.discount_threshold"
  flip_thresholds: "monte_carlo.sensitivity"
  value_net_map: "value_net.scan"
  assumption_ledger: "checkpoint.items"
  weights_source: "prior_v0（待案例库回测校准；报告须标注）"
